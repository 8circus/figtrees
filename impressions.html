<!-- lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Enlarged view">
  <button class="lb-close" id="lb-close" aria-label="Close">&#10005;</button>
  <div class="lb-stage" id="lb-stage"></div>
  <p class="lb-cap" id="lb-cap"></p>
</div>

<script>
(() => {
  'use strict';
  const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- reveal ---------- */
  const rio = new IntersectionObserver((es) => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rio.unobserve(e.target); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal').forEach(el => rio.observe(el));

  /* ---------- video tiles: bytes only on intent ---------- */
  const tiles = [...document.querySelectorAll('.tile')];
  const vidTiles = tiles.filter(t => t.dataset.kind === 'video');

  // the poster stays visible until the video is genuinely rendering frames,
  // so a slow connection never shows an empty box
  vidTiles.forEach(t => {
    const v = t.querySelector('video');
    v.addEventListener('playing', () => t.classList.add('playing'));
    v.addEventListener('pause',   () => t.classList.remove('playing'));
    v.addEventListener('error',   () => t.classList.remove('playing'));
  });

  function start(tile) {
    const v = tile.querySelector('video');
    if (!v.src) v.src = tile.dataset.src;   // first byte request happens here
    const p = v.play();
    if (p) p.catch(() => {});               // autoplay refused: poster just stays
  }
  function stop(tile) {
    const v = tile.querySelector('video');
    if (v.src) v.pause();
  }

  if (canHover && !calm) {
    vidTiles.forEach(t => {
      t.addEventListener('pointerenter', () => start(t));
      t.addEventListener('pointerleave', () => stop(t));
    });
  } else if (!calm) {
    // touch: play while the tile is properly in view, pause when it leaves
    const vio = new IntersectionObserver((es) => {
      es.forEach(e => e.isIntersecting ? start(e.target) : stop(e.target));
    }, { threshold: 0.55 });
    vidTiles.forEach(t => vio.observe(t));
  }

  /* ---------- lightbox ---------- */
  const lb = document.getElementById('lb');
  const stage = document.getElementById('lb-stage');
  const lbCap = document.getElementById('lb-cap');
  let lastFocus = null;

  function open(tile) {
    lastFocus = document.activeElement;
    vidTiles.forEach(stop);
    stage.innerHTML = '';

    if (tile.dataset.kind === 'video') {
      const v = document.createElement('video');
      v.src = tile.dataset.src;
      v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
      stage.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = tile.dataset.src;                       // full-size, fetched now
      img.alt = tile.querySelector('img').alt || '';
      stage.appendChild(img);
    }

    const cap = tile.querySelector('.cap');
    lbCap.textContent = cap ? cap.textContent : '';
    lb.classList.add('open');
    requestAnimationFrame(() => lb.classList.add('shown'));
    document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }

  function close() {
    lb.classList.remove('shown');
    setTimeout(() => {
      lb.classList.remove('open');
      stage.innerHTML = '';
      document.body.style.overflow = '';
      if (lastFocus) lastFocus.focus();
    }, 380);
  }

  tiles.forEach(t => {
    t.tabIndex = 0;
    t.setAttribute('role', 'button');
    t.addEventListener('click', () => open(t));
    t.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(t); }
    });
  });

  document.getElementById('lb-close').addEventListener('click', close);
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) close(); });
})();
</script>
